spring:
  application:
    name: overload-server
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
server:
  forward-headers-strategy: none
